name: Update AltStore Source
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  update_source:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Get IPA asset info
        id: asset
        uses: actions/github-script@v7
        with:
          script: |
            let release;

            if (context.eventName === 'workflow_dispatch') {
              // Manual run: grab the latest release automatically
              release = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo
              }).then(r => r.data);
            } else {
              // Triggered by release publish: re-fetch to avoid asset race condition
              const tagName = context.payload.release.tag_name;
              release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName
              }).then(r => r.data);
            }

            let asset = null;
            for (let attempt = 0; attempt < 5; attempt++) {
              asset = release.assets.find(a => a.name.endsWith('.ipa'));
              if (asset) break;
              console.log(`Attempt ${attempt + 1}: asset not found yet, retrying in 5s...`);
              await new Promise(r => setTimeout(r, 5000));
              release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: release.tag_name
              }).then(r => r.data);
            }

            if (!asset) throw new Error('No .ipa asset found after retries');

            core.setOutput('url', asset.browser_download_url);
            core.setOutput('size', asset.size);
            core.setOutput('version', release.tag_name.replace(/^v/, ''));
            core.setOutput('date', new Date().toISOString());
      - name: Update source.json
        env:
          VERSION: ${{ steps.asset.outputs.version }}
          DATE: ${{ steps.asset.outputs.date }}
          SIZE: ${{ steps.asset.outputs.size }}
          IPA_URL: ${{ steps.asset.outputs.url }}
          BUNDLE_ID: com.santhoshDsubramani.val_shop
        run: |
          python3 - <<'EOF'
          import json, os
          path = "source.json"
          with open(path) as f:
              data = json.load(f)
          bundle_id = os.environ["BUNDLE_ID"]
          new_version = {
              "version": os.environ["VERSION"],
              "date": os.environ["DATE"],
              "size": int(os.environ["SIZE"]),
              "downloadURL": os.environ["IPA_URL"],
              "localizedDescription": f"Automated build {os.environ['VERSION']}"
          }
          app = next((a for a in data["apps"] if a["bundleIdentifier"] == bundle_id), None)
          if app is None:
              raise SystemExit(f"App {bundle_id} not found in source.json")
          app["versions"] = [v for v in app["versions"] if v["version"] != new_version["version"]]
          app["versions"].insert(0, new_version)
          with open(path, "w") as f:
              json.dump(data, f, indent=4)
          EOF
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add source.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Update ValShop to v${{ steps.asset.outputs.version }}"
          git push
